<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<link rel="icon" href="/x/resource/image/logo.png">
<link rel="stylesheet" href="/x/css/style.css">
</head>

<body class="intro-active">

<!-- THEME BAR -->
<div id="theme-bar">
  <button onclick="setTheme('editorial')" id="btn-editorial">Editorial</button>
  <button onclick="setTheme('swiss')"     id="btn-swiss">E — Swiss</button>
  <button onclick="setTheme('magazine')"  id="btn-magazine">H — Magazine</button>
</div>

<!-- INTRO -->
<div id="intro-container">
  <img id="intro-bg"        src="/x/resource/image/intro-thumb.webp" alt="" aria-hidden="true" />
  <img id="intro-thumbnail" src="/x/resource/image/intro-thumb.webp" alt="Intro Thumbnail" />
  <div id="play-btn">
    <svg viewBox="0 0 100 100" role="button" tabindex="0" aria-label="Play intro video" id="play-icon">
      <circle cx="50" cy="50" r="48" fill="rgba(0,0,0,0.55)" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>
      <polygon points="38,28 38,72 74,50" fill="rgba(255,255,255,0.95)"/>
    </svg>
    <span id="intro-lang-badge" style="display:none;font-family:monospace;font-size:0.55rem;letter-spacing:0.15em;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.2);padding:0.15rem 0.5rem;text-transform:uppercase;"></span>
  </div>
  <button id="skip-intro">Skip</button>
</div>

<header>
  <img src="/x/resource/image/logo.png" alt="Master Logo" class="logo-placeholder">
  <h1>mr.sgsz</h1>
  <div id="mode-toggle" aria-label="Content mode toggle">
    <span id="mode-tech" onclick="switchMode('tech')" class="mode-label">TECH</span>
    <span class="mode-slash">/</span>
    <span id="mode-philosophy" onclick="switchMode('philosophy')" class="mode-label">PHILOSOPHY</span>
  </div>

  <nav aria-label="Main navigation">
    <button id="nav-toggle" aria-expanded="false" aria-controls="nav-list">&#9776;</button>
    <ul id="nav-list" style="list-style:none;padding:0;margin:0;flex-wrap:wrap;gap:0.5rem 1.5rem;align-items:center;">
      <li><a href="#" onclick="showCategory('blog');closeNav();return false;">Blog</a></li>
      <li><a href="#" onclick="showCategory('podcast');closeNav();return false;">Podcast</a></li>
      <li><a href="#" onclick="showCategory('youtube');closeNav();return false;">YouTube</a></li>
      <li><a href="#" onclick="showCategory('references');closeNav();return false;">Sources</a></li>
      <li><a href="#" onclick="showCategory('aboutme');closeNav();return false;">About Me</a></li>
      <li><a href="#" onclick="showCategory('all');closeNav();return false;">All</a></li>
    </ul>
    <button id="dark-btn" aria-label="Toggle dark mode" onclick="toggleDark()">☽</button>
  </nav>

  <!-- LANGUAGE SWITCHER -->
  <div id="lang-switcher" style="font-family:monospace;font-size:0.62rem;letter-spacing:0.12em;display:flex;gap:0.4rem;align-items:center;">
    {{ range site.Languages }}
    <a href="{{ relLangURL "/" }}" style="color:{{ if eq .Lang $.Site.Language.Lang }}#000{{ else }}#aaa{{ end }};text-decoration:none;text-transform:uppercase;border-bottom:{{ if eq .Lang $.Site.Language.Lang }}2px solid #000{{ else }}2px solid transparent{{ end }};padding-bottom:1px;">{{ .Label }}</a>
    {{ end }}
  </div>
</header>

<main>
  {{ block "main" . }}{{ end }}
</main>

<script src="/x/js/script.js"></script>
<script>
function setTheme(t) {
  document.body.classList.remove('theme-swiss','theme-magazine');
  if (t !== 'editorial') document.body.classList.add('theme-' + t);
  localStorage.setItem('theme-style', t);
  document.querySelectorAll('#theme-bar button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + t).classList.add('active');
  if (t === 'magazine' && typeof applyMagazineTitles === 'function') applyMagazineTitles();
}
(function(){
  var t = localStorage.getItem('theme-style') || 'editorial';
  setTheme(t);
})();
</script>
</body>
</html>
